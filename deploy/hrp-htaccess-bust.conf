# BEGIN HRP Cache Bust
# Pretty HTML only — never redirect legacy /00 cron + API scripts (cron-job.org
# treats 302 as failure and will disable jobs).
<IfModule mod_rewrite.c>
RewriteEngine On
RewriteCond %{REQUEST_METHOD} GET [NC]
RewriteCond %{QUERY_STRING} !(^|&)hrpv=
RewriteCond %{REQUEST_URI} !^/00(/|$) [NC]
RewriteCond %{REQUEST_URI} !^/wp-(admin|content|includes|json|cron) [NC]
RewriteCond %{REQUEST_URI} !^/(xmlrpc\.php|favicon\.ico) [NC]
RewriteCond %{REQUEST_URI} !\.(php|css|js|mjs|map|jpe?g|png|gif|webp|ico|svg|woff2?|ttf|eot|txt|xml|pdf|zip|gz)$ [NC]
RewriteRule ^(.*)$ /$1?hrpv=0.3.11 [R=302,L,QSA]
</IfModule>
# END HRP Cache Bust
