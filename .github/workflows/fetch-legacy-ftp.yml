name: Fetch legacy from FTP

# Pull only /00 + wp-content themes/plugins from Namecheap FTP.
# Do NOT upload 6.9GB local zips.

on:
  workflow_dispatch:
    inputs:
      remote_root:
        description: "Remote path after login (try / then public_html then buycarl.com)"
        required: true
        default: "/"
      include_plugins:
        description: "Also download wp-content/plugins"
        type: boolean
        default: true
      mode:
        description: "Connection mode"
        type: choice
        options:
          - ftps
          - ftp
          - auto
        default: auto

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Probe + download via Python (safe password / FTPS)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          REMOTE_ROOT: ${{ inputs.remote_root }}
          INCLUDE_PLUGINS: ${{ inputs.include_plugins }}
          FTP_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          test -n "${FTP_SERVER:-}" || { echo "Missing FTP_SERVER"; exit 1; }
          test -n "${FTP_USERNAME:-}" || { echo "Missing FTP_USERNAME — add secret FTP_USERNAME=buycarlftp@buycarl.com"; exit 1; }
          test -n "${FTP_PASSWORD:-}" || { echo "Missing FTP_PASSWORD"; exit 1; }
          python3 - <<'PY'
          import ftplib, os, ssl, sys, time
          from pathlib import Path

          host = os.environ["FTP_SERVER"].strip()
          port = int(os.environ.get("FTP_PORT") or "21")
          user = os.environ["FTP_USERNAME"]
          password = os.environ["FTP_PASSWORD"]
          root = os.environ.get("REMOTE_ROOT") or "/"
          mode = (os.environ.get("FTP_MODE") or "auto").lower()
          include_plugins = (os.environ.get("INCLUDE_PLUGINS") or "true").lower() == "true"
          out = Path("legacy-ftp")
          out.mkdir(parents=True, exist_ok=True)

          def connect(kind: str):
              print(f"== Connecting {kind} {host}:{port} as {user!r} ==")
              if kind == "ftps":
                  ctx = ssl.create_default_context()
                  ctx.check_hostname = False
                  ctx.verify_mode = ssl.CERT_NONE
                  ftp = ftplib.FTP_TLS(context=ctx, timeout=45)
                  ftp.connect(host, port)
                  ftp.login(user, password)
                  try:
                      ftp.prot_p()
                  except Exception as e:
                      print(f"prot_p warning: {e}")
                  return ftp
              ftp = ftplib.FTP(timeout=45)
              ftp.connect(host, port)
              ftp.login(user, password)
              return ftp

          def try_connect():
              order = ["ftps", "ftp"] if mode == "auto" else [mode]
              last = None
              for kind in order:
                  try:
                      return connect(kind), kind
                  except Exception as e:
                      last = e
                      print(f"FAIL {kind}: {type(e).__name__}: {e}")
              raise SystemExit(f"Could not connect with modes {order}: {last}")

          ftp, used = try_connect()
          print(f"Connected with {used}")
          print("Welcome:", getattr(ftp, "welcome", "")[:200])

          # Normalize / navigate
          try:
              ftp.cwd(root)
          except Exception as e:
              print(f"cwd({root!r}) failed: {e}")
              print("Trying common Namecheap roots...")
              for cand in ["/", "/public_html", "/buycarl.com", "/home/fengrmkw/buycarl.com", "public_html", "buycarl.com"]:
                  try:
                      ftp.cwd(cand)
                      print(f"OK cwd -> {cand}")
                      root = cand
                      break
                  except Exception as e2:
                      print(f"  miss {cand}: {e2}")
              else:
                  raise SystemExit("Could not cwd into a known site root. Check FTP login home with FileZilla.")

          pwd = ftp.pwd()
          print("PWD:", pwd)
          names = []
          ftp.retrlines("LIST", names.append)
          print("LIST (first 40):")
          for line in names[:40]:
              print(" ", line)
          listing = "\n".join(names).lower()

          targets = []
          # Prefer exact folder names
          for folder, dest in [
              ("00", out / "00"),
              ("wp-content", out / "wp-content"),
          ]:
              if any(f" {folder.lower()}" in line.lower() or line.lower().endswith(folder.lower()) for line in names):
                  targets.append((folder, dest))
              else:
                  print(f"NOTE: {folder!r} not obvious in listing")

          if not targets:
              # Maybe already inside public_html but folders named differently
              print("No 00/wp-content found at this root. Full names:")
              for line in names:
                  print(" ", line)
              raise SystemExit("Wrong remote_root — re-run with the folder that contains 00 and wp-content (check FileZilla).")

          def ensure_dir(p: Path):
              p.mkdir(parents=True, exist_ok=True)

          def is_dir(ftp, name):
              cur = ftp.pwd()
              try:
                  ftp.cwd(name)
                  ftp.cwd(cur)
                  return True
              except Exception:
                  return False

          downloaded_files = 0

          def mirror(remote_path: str, local: Path, depth=0, max_depth=30):
              nonlocal downloaded_files
              if depth > max_depth:
                  return
              ensure_dir(local)
              # skip junk
              skip_names = {".git", "node_modules", "cache", "uploads", "upgrade", "ai1wm-backups"}
              entries = []
              try:
                  ftp.retrlines(f"LIST {remote_path}", entries.append)
              except Exception:
                  entries = []
                  ftp.cwd(remote_path)
                  ftp.retrlines("LIST", entries.append)
                  ftp.cwd("..")

              # Parse crude LIST
              for line in entries:
                  parts = line.split(maxsplit=8)
                  if len(parts) < 9:
                      continue
                  name = parts[8]
                  if name in (".", "..") or name in skip_names:
                      continue
                  # For wp-content, only themes (+ plugins optionally)
                  if remote_path.rstrip("/").endswith("wp-content") and name not in (
                      ("themes", "plugins") if include_plugins else ("themes",)
                  ):
                      if name not in ("themes", "plugins"):
                          continue
                      if name == "plugins" and not include_plugins:
                          continue
                  remote = f"{remote_path.rstrip('/')}/{name}"
                  local_path = local / name
                  if line.startswith("d") or is_dir(ftp, remote):
                      print(f"{'  '*depth}DIR {remote}")
                      mirror(remote, local_path, depth + 1, max_depth)
                  else:
                      ensure_dir(local_path.parent)
                      print(f"{'  '*depth}GET {remote}")
                      with open(local_path, "wb") as f:
                          ftp.retrbinary(f"RETR {remote}", f.write)
                      downloaded_files += 1

          for folder, dest in targets:
              print(f"== Mirroring {folder} -> {dest} ==")
              mirror(folder, dest)

          ftp.quit()
          print(f"Downloaded files: {downloaded_files}")
          if downloaded_files < 5:
              raise SystemExit("Too few files downloaded — connection or path wrong.")
          PY

          echo "## Local sizes"
          du -sh legacy-ftp legacy-ftp/* legacy-ftp/wp-content/* 2>/dev/null || true
          find legacy-ftp -maxdepth 3 -type d | head -100

      - name: Pack artifact
        run: |
          set -euo pipefail
          if [ -d legacy-ftp/wp-content/plugins ]; then
            SIZE_MB=$(du -sm legacy-ftp/wp-content/plugins | awk '{print $1}')
            echo "plugins size: ${SIZE_MB}MB"
            if [ "$SIZE_MB" -gt 400 ]; then
              echo "Plugins tree large — keeping name matches only"
              mkdir -p /tmp/plugins-keep
              find legacy-ftp/wp-content/plugins -mindepth 1 -maxdepth 1 -type d \
                \( -iname '*race*' -o -iname '*hkjc*' -o -iname '*horse*' -o -iname '*m6*' -o -iname '*mark*' -o -iname '*yoast*' -o -iname '*buycarl*' -o -iname '*carl*' -o -iname '*custom*' \) \
                -exec cp -a {} /tmp/plugins-keep/ \;
              rm -rf legacy-ftp/wp-content/plugins
              mkdir -p legacy-ftp/wp-content/plugins
              cp -a /tmp/plugins-keep/. legacy-ftp/wp-content/plugins/ || true
            fi
          fi
          tar -czf legacy-ftp.tgz -C legacy-ftp .
          ls -lh legacy-ftp.tgz
          test "$(du -k legacy-ftp.tgz | awk '{print $1}')" -gt 100

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: legacy-ftp
          path: legacy-ftp.tgz
          retention-days: 7
          if-no-files-found: error

      - name: Summary
        run: |
          {
            echo "### Legacy FTP fetch"
            echo
            ls -lh legacy-ftp.tgz
            echo
            echo "Tell the Cloud Agent: **FTP fetch done**"
          } >> "$GITHUB_STEP_SUMMARY"
