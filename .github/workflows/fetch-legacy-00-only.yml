name: Fetch legacy 00 only

# Download 00.zip from FTP jail root (one file), then unzip.
# Avoids thousands of FTPS transfers that drop with SSLEOFError.
# Fallback: resume file-by-file mirror of /00 with reconnect.

on:
  workflow_dispatch:
    inputs:
      host_override:
        description: "FTP host (Origin IP)"
        required: false
        default: "209.74.67.142"
      remote_root:
        description: "FTP site root (usually /)"
        required: true
        default: "/"
      mode:
        description: "ftps recommended"
        type: choice
        options: [ftps, ftp, auto]
        default: ftps
      strategy:
        description: "Prefer 00.zip single download"
        type: choice
        options: [zip_then_mirror, zip_only, mirror_only]
        default: zip_then_mirror

jobs:
  fetch-00:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Download 00.zip or mirror /00
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          HOST_OVERRIDE: ${{ inputs.host_override }}
          REMOTE_ROOT: ${{ inputs.remote_root }}
          FTP_MODE: ${{ inputs.mode }}
          STRATEGY: ${{ inputs.strategy }}
        run: |
          set -euo pipefail
          HOST="${HOST_OVERRIDE:-}"
          [ -z "$HOST" ] && HOST="${FTP_HOST:-}"
          [ -z "$HOST" ] && HOST="${FTP_SERVER:-}"
          export FTP_CONNECT_HOST="$HOST"
          test -n "$FTP_CONNECT_HOST" && test -n "${FTP_USERNAME:-}" && test -n "${FTP_PASSWORD:-}"
          echo "Host=$FTP_CONNECT_HOST root=$REMOTE_ROOT mode=$FTP_MODE strategy=$STRATEGY"
          mkdir -p legacy-ftp
          python3 -u <<'PY'
          import ftplib, os, ssl, sys, time, zipfile
          from pathlib import Path

          host = os.environ["FTP_CONNECT_HOST"].strip()
          port = int(os.environ.get("FTP_PORT") or "21")
          user = os.environ["FTP_USERNAME"]
          password = os.environ["FTP_PASSWORD"]
          root = (os.environ.get("REMOTE_ROOT") or "/").strip() or "/"
          mode = (os.environ.get("FTP_MODE") or "ftps").lower()
          strategy = (os.environ.get("STRATEGY") or "zip_then_mirror").lower()
          out = Path("legacy-ftp")
          out.mkdir(exist_ok=True)

          SKIP_EXT = {".zip", ".gz", ".tar", ".rar", ".7z", ".mp4", ".mov", ".otf", ".ttf", ".woff", ".woff2", ".svg", ".png", ".jpg", ".jpeg", ".gif", ".webp"}
          SKIP_DIR = {"font", "fonts", "node_modules", "cache", "uploads", ".git", "vendor/bin"}

          def connect(kind="ftps"):
              if kind == "ftps" or (kind == "auto"):
                  try:
                      ctx = ssl.create_default_context()
                      ctx.check_hostname = False
                      ctx.verify_mode = ssl.CERT_NONE
                      ftp = ftplib.FTP_TLS(context=ctx, timeout=120)
                      ftp.connect(host, port)
                      ftp.login(user, password)
                      ftp.set_pasv(True)
                      try:
                          ftp.prot_p()
                      except Exception as e:
                          print("prot_p", e, flush=True)
                      print(f"connected ftps {host}:{port}", flush=True)
                      return ftp, "ftps"
                  except Exception as e:
                      print(f"ftps fail: {e}", flush=True)
                      if kind == "ftps":
                          raise
              ftp = ftplib.FTP(timeout=120)
              ftp.connect(host, port)
              ftp.login(user, password)
              ftp.set_pasv(True)
              print(f"connected ftp {host}:{port}", flush=True)
              return ftp, "ftp"

          def ensure_root(ftp):
              for cand in [root, "/", "."]:
                  try:
                      ftp.cwd(cand)
                      print(f"cwd {cand} -> {ftp.pwd()}", flush=True)
                      return
                  except Exception as e:
                      print(f"cwd miss {cand}: {e}", flush=True)
              raise SystemExit("cannot cwd site root")

          def nlst(ftp):
              try:
                  return ftp.nlst()
              except Exception as e:
                  print(f"nlst fail: {e}", flush=True)
                  return []

          def download_zip(ftp) -> Path | None:
              names = [n.split("/")[-1] for n in nlst(ftp)]
              print("root sample:", names[:50], flush=True)
              candidates = [n for n in names if n.lower() in ("00.zip", "00.tar.gz", "00.tgz")]
              if not candidates:
                  # case variants
                  candidates = [n for n in names if n.lower().startswith("00.") and n.lower().endswith((".zip", ".tgz", ".gz"))]
              if not candidates:
                  print("no 00.zip at root", flush=True)
                  return None
              name = candidates[0]
              dest = out / name
              print(f"RETR {name} -> {dest}", flush=True)
              with open(dest, "wb") as f:
                  ftp.retrbinary(f"RETR {name}", f.write)
              size = dest.stat().st_size
              print(f"downloaded {name} bytes={size}", flush=True)
              if size < 1000:
                  raise SystemExit("00 archive too small")
              return dest

          def extract_zip(zpath: Path) -> int:
              dest = out / "00"
              dest.mkdir(parents=True, exist_ok=True)
              if zpath.suffix.lower() == ".zip":
                  with zipfile.ZipFile(zpath, "r") as zf:
                      # If zip already contains top-level 00/, extract as-is into legacy-ftp
                      names = zf.namelist()
                      print(f"zip entries={len(names)} sample={names[:10]}", flush=True)
                      has_00_prefix = any(n.replace("\\", "/").startswith("00/") for n in names)
                      if has_00_prefix:
                          zf.extractall(out)
                      else:
                          zf.extractall(dest)
              else:
                  import tarfile
                  with tarfile.open(zpath, "r:*") as tf:
                      tf.extractall(out / "00")
              files = sum(1 for p in (out / "00").rglob("*") if p.is_file())
              print(f"extracted files under legacy-ftp/00: {files}", flush=True)
              return files

          def is_dir(ftp, name):
              cur = ftp.pwd()
              try:
                  ftp.cwd(name)
                  ftp.cwd(cur)
                  return True
              except Exception:
                  return False

          def mirror(ftp, kind, remote_rel, local: Path, depth=0, stats=None):
              if stats is None:
                  stats = {"files": 0, "errors": 0}
              local.mkdir(parents=True, exist_ok=True)
              # reconnect helper
              def reconnect():
                  nonlocal ftp, kind
                  try:
                      ftp.quit()
                  except Exception:
                      try:
                          ftp.close()
                      except Exception:
                          pass
                  time.sleep(2)
                  ftp, kind = connect(mode if mode != "auto" else kind)
                  ensure_root(ftp)
                  # walk back into remote_rel from root using absolute from site
                  # caller keeps path stack via remote_rel relative to site /00
                  return ftp

              cur = ftp.pwd()
              try:
                  ftp.cwd(remote_rel)
              except Exception as e:
                  print(f"cwd {remote_rel} fail: {e}", flush=True)
                  return stats
              here = ftp.pwd()
              entries = nlst(ftp)
              for raw in entries:
                  name = raw.split("/")[-1]
                  if name in (".", ".."):
                      continue
                  lower = name.lower()
                  if name.lower() in SKIP_DIR or lower in SKIP_DIR:
                      print(f"{'  '*depth}SKIPDIR {name}", flush=True)
                      continue
                  if any(lower.endswith(ext) for ext in SKIP_EXT):
                      print(f"{'  '*depth}SKIP {name}", flush=True)
                      continue
                  try:
                      directory = is_dir(ftp, name)
                  except Exception:
                      directory = False
                  if directory:
                      print(f"{'  '*depth}DIR {name}", flush=True)
                      mirror(ftp, kind, name, local / name, depth + 1, stats)
                      try:
                          ftp.cwd(here)
                      except Exception:
                          ftp = reconnect()
                          # best-effort: go to /00 then relative — simplified: cwd / then 00 then path
                          ensure_root(ftp)
                          ftp.cwd("00")
                          if depth > 0:
                              pass
                          ftp.cwd(here) if False else None
                  else:
                      dest = local / name
                      for attempt in range(1, 4):
                          try:
                              print(f"{'  '*depth}GET {name} (try {attempt})", flush=True)
                              with open(dest, "wb") as f:
                                  ftp.retrbinary(f"RETR {name}", f.write)
                              stats["files"] += 1
                              break
                          except Exception as e:
                              print(f"{'  '*depth}ERR {name}: {e}", flush=True)
                              stats["errors"] += 1
                              try:
                                  ftp, kind = connect(mode if mode != "auto" else kind)
                                  ensure_root(ftp)
                                  ftp.cwd("00")
                                  # navigate to here by parts from /00
                                  rel = str(local.relative_to(out / "00")) if local != (out / "00") else ""
                                  if rel and rel != ".":
                                      for part in Path(rel).parts:
                                          ftp.cwd(part)
                              except Exception as e2:
                                  print(f"reconnect nav fail: {e2}", flush=True)
                              time.sleep(1)
                      else:
                          print(f"{'  '*depth}GIVEUP {name}", flush=True)
              try:
                  ftp.cwd(cur)
              except Exception:
                  pass
              return stats

          ftp, kind = connect(mode)
          ensure_root(ftp)

          files = 0
          if strategy in ("zip_then_mirror", "zip_only"):
              z = download_zip(ftp)
              if z:
                  files = extract_zip(z)
              elif strategy == "zip_only":
                  raise SystemExit("00.zip not found")

          if files < 5 and strategy in ("zip_then_mirror", "mirror_only"):
              print("falling back to file mirror of /00", flush=True)
              try:
                  ftp.cwd("/")
              except Exception:
                  pass
              ensure_root(ftp)
              # fresh connection for mirror
              try:
                  ftp.quit()
              except Exception:
                  pass
              ftp, kind = connect(mode)
              ensure_root(ftp)
              stats = mirror(ftp, kind, "00", out / "00")
              files = stats["files"]
              print(f"mirror done files={files} errors={stats['errors']}", flush=True)

          try:
              ftp.quit()
          except Exception:
              pass

          if files < 5:
              raise SystemExit(f"too few files ({files})")
          print(f"SUCCESS files={files}", flush=True)
          PY

          du -sh legacy-ftp/00 || du -sh legacy-ftp/*
          find legacy-ftp/00 -type f 2>/dev/null | wc -l

      - name: Pack + upload
        run: |
          set -euo pipefail
          # Prefer extracted 00 tree; keep zip too if present
          tar -czf legacy-00.tgz -C legacy-ftp .
          ls -lh legacy-00.tgz
          BYTES=$(stat -c%s legacy-00.tgz)
          echo "artifact_bytes=$BYTES"
          test "$BYTES" -gt 50000
          test "$BYTES" -lt 900000000

      - uses: actions/upload-artifact@v4
        with:
          name: legacy-00
          path: legacy-00.tgz
          retention-days: 7

      - name: Summary
        run: |
          echo "### legacy-00 ready" >> "$GITHUB_STEP_SUMMARY"
          ls -lh legacy-00.tgz >> "$GITHUB_STEP_SUMMARY"
          echo "Reply: **FTP 00 done**" >> "$GITHUB_STEP_SUMMARY"
